name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

env:
  ANDROID_SDK_VERSION: '35'
  NDK_VERSION: '26.1.10909125'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-${{ env.ANDROID_SDK_VERSION }} platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_SDK_ROOT 2>/dev/null || echo "SDK root not found"
          which sdkmanager || true
          which adb || true

      - name: Set up Gradle wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -x "./gradlew" ]; then
            echo "Gradle wrapper not found or not executable"
            exit 1
          fi
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper jar not found"
            exit 1
          fi
          echo "Gradle wrapper verified"

      - name: Download and extract PRoot
        run: |
          mkdir -p app/src/main/assets/proot
          if [ -f "./scripts/fetch-proot.sh" ]; then
            chmod +x ./scripts/fetch-proot.sh
            ./scripts/fetch-proot.sh || echo "fetch-proot.sh failed, continuing"
          else
            echo "fetch-proot.sh not found, skipping"
          fi
          # If script produced proot-static, copy assets
          if [ -d "proot-static" ]; then
            cp proot-static/proot-arm64 app/src/main/assets/proot/proot-arm64 2>/dev/null || true
            cp proot-static/loader-arm64 app/src/main/assets/proot/loader-arm64 2>/dev/null || true
          fi

      - name: Build APK with Gradle
        run: |
          ./gradlew clean assembleDebug assembleRelease --no-daemon --stacktrace
          echo "APK build completed"

      - name: Find generated APKs
        run: |
          echo "=== APKs found ==="
          find app/build/outputs/apk -name "*.apk" -type f || true

      - name: Rename APK to include version info
        run: |
          mkdir -p download

          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*= "\(.*\)"/\1/' | tr -d ' ')
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | sed 's/.*= \(.*\)/\1/' | tr -d ' ')
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          if [ -n "$RELEASE_APK" ]; then
            NAME="ubuntu-terminal-${VERSION_NAME}-${VERSION_CODE}-release.apk"
            cp "$RELEASE_APK" "download/$NAME"
            echo "Release APK: download/$NAME"
          fi

          if [ -n "$DEBUG_APK" ]; then
            NAME="ubuntu-terminal-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
            cp "$DEBUG_APK" "download/$NAME"
            echo "Debug APK: download/$NAME"
          fi

          ls -lh download/ || true

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-terminal-apk
          path: download/*.apk
          retention-days: 7

      - name: Create GitHub Release (for tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: download/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Run post-build validations
        if: always()
        run: |
          echo "Running validation scripts..."
          if [ -f "./scripts/validate_apk.sh" ]; then
            chmod +x ./scripts/validate_apk.sh
            ./scripts/validate_apk.sh || echo "validation failed"
          fi
